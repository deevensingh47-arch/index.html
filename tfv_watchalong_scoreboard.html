<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFV Watchalong Scoreboard</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  .board {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 12px 20px;
    background: rgba(28, 31, 30, .96);
    border: 2px solid #39d353;
    border-radius: 12px;
    color: #fff;
    white-space: nowrap;
  }
  .score {
    font-size: 44px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .divider {
    width: 2px;
    height: 42px;
    background: #39d353;
    opacity: .9;
  }
  .clock {
    color: #39d353;
    font-size: 34px;
    line-height: 1;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    min-width: 104px;
    text-align: center;
  }
  .controls {
    display: flex;
    gap: 6px;
    margin-top: 9px;
    justify-content: center;
  }
  button {
    border: 1px solid #39d353;
    border-radius: 6px;
    background: #202522;
    color: white;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 700;
  }
  button:active { background: #315b39; }
  .wrap { display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <div class="score"><span id="home">0</span> – <span id="away">0</span></div>
    <div class="divider"></div>
    <div class="clock" id="clock">00:00</div>
  </div>
  <div class="controls">
    <button id="start">START</button>
    <button id="pause">PAUSE</button>
    <button id="reset">RESET</button>
    <button id="homePlus">HOME +</button>
    <button id="awayPlus">AWAY +</button>
  </div>
</div>
<script>
(() => {
  let seconds = 0, interval = null;
  const clock = document.getElementById('clock');
  const render = () => {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    clock.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  };
  document.getElementById('start').onclick = () => {
    if (interval !== null) return;
    interval = setInterval(() => { seconds++; render(); }, 1000);
  };
  document.getElementById('pause').onclick = () => {
    clearInterval(interval); interval = null;
  };
  document.getElementById('reset').onclick = () => {
    clearInterval(interval); interval = null; seconds = 0; render();
  };
  document.getElementById('homePlus').onclick = () => {
    const el = document.getElementById('home');
    el.textContent = Number(el.textContent) + 1;
  };
  document.getElementById('awayPlus').onclick = () => {
    const el = document.getElementById('away');
    el.textContent = Number(el.textContent) + 1;
  };
})();
</script>
</body>
</html>
